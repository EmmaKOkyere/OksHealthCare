<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Book Appointment | OksHealthCare
    </title>

    <link rel="stylesheet"
          href="styles/styles.css">

</head>


<body>

<header class="header">

    <div class="nav-container">

        <a href="index.html"
           class="logo">

            Oks<span>HealthCare</span>

        </a>

        <button class="menu-button"
                id="menuButton">

            ☰

        </button>


        <nav id="navigation">

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="team.html">
                Our Team
            </a>

            <a href="appointment.html"
               class="active">

                Appointment

            </a>

            <a href="contact.html">
                Contact
            </a>

        </nav>

    </div>

</header>


<main>

    <section class="page-banner">

        <div class="container">

            <h1>
                Book an Appointment
            </h1>

            <p>
                Request a convenient date
                for your visit.
            </p>

        </div>

    </section>


    <section class="section">

        <div class="container form-container">

            <form id="appointmentForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input type="text"
                           id="name"
                           required>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input type="tel"
                           id="phone"
                           required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email">

                </div>


                <div class="form-group">

                    <label for="service">
                        Service
                    </label>

                    <select id="service"
                            required>

                        <option value="">
                            Select a service
                        </option>

                        <option>
                            General Consultation
                        </option>

                        <option>
                            Health Screening
                        </option>

                        <option>
                            Family Healthcare
                        </option>

                        <option>
                            Follow-Up Care
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="date">
                        Preferred Date
                    </label>

                    <input type="date"
                           id="date"
                           required>

                </div>


                <button type="submit"
                        class="button primary-button">

                    Request Appointment

                </button>


                <p id="formMessage"
                   class="form-message">
                </p>

            </form>


            <div class="privacy-note">

                <strong>
                    Privacy Notice
                </strong>

                <p>
                    Please do not enter confidential
                    medical information on this form.
                    This form is only for appointment
                    scheduling.
                </p>

            </div>

        </div>

    </section>

</main>


<footer>

    <div class="container footer-content">

        <p>
            © 2026 OksHealthCare
        </p>

    </div>

</footer>


<script src="script.js"></script>

</body>

</html>
